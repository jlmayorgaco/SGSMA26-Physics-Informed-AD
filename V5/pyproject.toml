[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-pmu"
version = "0.1.0"
description = "Phase-1 scaffold and legacy adapters for SGSMA 2026 PMU anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SGSMA Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pydantic>=2.0",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
