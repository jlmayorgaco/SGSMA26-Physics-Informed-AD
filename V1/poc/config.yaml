seed: 42

paths:
  raw_data: data/raw
  real_metadata: data/metadata
  poc_synth: poc/data_synth
  existing_synth: data/synthetic
  results: poc/results

synthetic:
  scenario_seconds: 30.0
  smoke_limit: 28
  full_limit: 0

ablation:
  window_size: 90
  baseline_seconds: 60.0
  lambda_params: 0.03
  use_existing_synthetic: true
  max_existing_synthetic: 196

classifiers:
  lgbm:
    num_leaves: 31
    n_estimators: 200
    min_data_in_leaf: 3
    learning_rate: 0.05

