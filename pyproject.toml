[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgsma-physics-informed-ad"
version = "0.1.0"
description = "Bus-agnostic physics-informed PMU anomaly detection for SGSMA 2026"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SGSMA Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pydantic>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
simulation = [
  "andes>=1.9.3",
  "pyarrow>=14.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
rawsim39 = ["configs/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "rawsim39*"]
exclude = ["tests*", "experiments*", "output*", "examples*"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
