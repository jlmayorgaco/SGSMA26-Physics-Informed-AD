[project]
name = "sgsma2026-pmu-ad"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.1",
    "scipy>=1.11,<1.14",
    "pandas>=2.1,<2.3",
    "pandapower>=2.14,<3.0",
    "andes>=1.9,<2.0",
    "jax>=0.4.28,<0.5",
    "jaxlib>=0.4.28,<0.5",
    "lightgbm>=4.3,<5.0",
    "scikit-learn>=1.4,<1.6",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "openpyxl>=3.1,<4.0",
    "tqdm>=4.66,<5.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<0.6",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
